<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walentynka dla Mati</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffc3a0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Flying hearts in background */
        .heart {
            position: absolute;
            font-size: 30px;
            animation: float 10s infinite;
            opacity: 0.6;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 60px 80px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            z-index: 10;
            position: relative;
        }

        h1 {
            color: #ff1744;
            font-size: 48px;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            padding: 20px 60px;
            font-size: 28px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        #takBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        #takBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 20px rgba(245, 87, 108, 0.4);
        }

        #nieBtn {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
            position: relative;
        }

        .love-message {
            display: none;
            font-size: 72px;
            color: #ff1744;
            font-weight: bold;
            margin-top: 30px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        /* Confetti styles */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f0f;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Flying hearts -->
    <div id="hearts-container"></div>

    <div class="container">
        <h1 id="question">Mati, zostaniesz moją walentynką?</h1>
        <div class="buttons" id="buttonsContainer">
            <button id="takBtn">TAK</button>
            <button id="nieBtn">NIE</button>
        </div>
        <div class="love-message" id="loveMessage">Kocham Cię!!</div>
    </div>

    <script>
        // Create flying hearts
        function createHearts() {
            const container = document.getElementById('hearts-container');
            const heartSymbols = ['❤️', '💕', '💖', '💗', '💝'];
            
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 10 + 's';
                heart.style.animationDuration = (Math.random() * 5 + 8) + 's';
                container.appendChild(heart);
            }
        }

        // Make NIE button run away from mouse
        const nieBtn = document.getElementById('nieBtn');
        
        nieBtn.addEventListener('mouseenter', function() {
            const maxX = window.innerWidth - nieBtn.offsetWidth - 100;
            const maxY = window.innerHeight - nieBtn.offsetHeight - 100;
            
            const randomX = Math.max(0, Math.random() * maxX);
            const randomY = Math.max(0, Math.random() * maxY);
            
            nieBtn.style.position = 'fixed';
            nieBtn.style.left = randomX + 'px';
            nieBtn.style.top = randomY + 'px';
        });

        // TAK button functionality
        const takBtn = document.getElementById('takBtn');
        const question = document.getElementById('question');
        const buttonsContainer = document.getElementById('buttonsContainer');
        const loveMessage = document.getElementById('loveMessage');

        takBtn.addEventListener('click', function() {
            question.classList.add('hidden');
            buttonsContainer.classList.add('hidden');
            loveMessage.style.display = 'block';
            
            createConfetti();
        });

        // Create confetti animation
        function createConfetti() {
            const colors = ['#ff1744', '#f50057', '#d500f9', '#651fff', '#2979ff', '#00e676', '#ffea00'];
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = (Math.random() * 10 + 5) + 'px';
                    const duration = Math.random() * 2 + 2;
                    confetti.style.animationDuration = duration + 's';
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, duration * 1000);
                }, i * 30);
            }
        }

        // Initialize hearts on page load
        createHearts();
    </script>
</body>
</html>
